server:
  port: ${PORT:8080}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://admin0:admin0@stocktracker.emba47y.mongodb.net/stock-tracker?retryWrites=true&authSource=admin&connectTimeoutMS=30000&socketTimeoutMS=60000&serverSelectionTimeoutMS=30000}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:stock-tracker-jwt-secret-key-change-in-production-2026}
    expiration: ${JWT_EXPIRATION:86400000}
  scraper:
    base-url: ${SCRAPER_BASE_URL:https://www.tradingview.com/symbols/CSELK-}
    url-suffix: ${SCRAPER_URL_SUFFIX:0000/financials-dividends/}
    delay-ms: ${SCRAPER_DELAY_MS:6000}
    headless: ${SCRAPER_HEADLESS:true}
    page-load-timeout-sec: ${SCRAPER_PAGE_LOAD_TIMEOUT:30}
    element-wait-timeout-sec: ${SCRAPER_ELEMENT_WAIT_TIMEOUT:15}
